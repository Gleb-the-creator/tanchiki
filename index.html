<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Танчики</title>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script src="vendor/gsap.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f0c; user-select: none; -webkit-user-select: none; }
    #webgl-container { position: fixed; inset: 0; }
    #webgl-container canvas { display: block; }
  </style>
</head>
<body>
  <div id="ld" style="position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0f0c;color:#d6e4d0;font:600 18px/1.4 system-ui,sans-serif;letter-spacing:.06em">
    <div style="font-size:34px;margin-bottom:18px">ТАНЧИКИ</div>
    <div style="width:280px;height:8px;background:#1f2a22;border-radius:4px;overflow:hidden"><div id="ldb" style="height:100%;width:0;background:#4ade80;transition:width .2s"></div></div>
    <div id="ldt" style="margin-top:10px;font-size:14px;opacity:.75">Загрузка… 0%</div>
  </div>
  <script>
    function __ld(p) { document.getElementById('ldb').style.width = p + '%'; document.getElementById('ldt').textContent = p < 100 ? 'Загрузка… ' + p + '%' : 'Запуск…'; }
    window.addEventListener('load', () => setTimeout(() => { const e = document.getElementById('ld'); e.style.transition = 'opacity .4s'; e.style.opacity = 0; setTimeout(() => e.remove(), 450); }, 150));
  </script>
  <div id="webgl-container"></div>
  <script>
    // =========================================================================
    // 1. SCENE, CAMERA, RENDERER & WET PARADE ASPHALT ENVIRONMENT
    // =========================================================================
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x161c1a);
    scene.fog = new THREE.FogExp2(0x161c1a, 0.0014);

    function getViewportSize() {
      const w = container.clientWidth || window.innerWidth || 1280;
      const h = container.clientHeight || window.innerHeight || 700;
      return { w, h };
    }
    const initSize = getViewportSize();
    const camera = new THREE.PerspectiveCamera(38, initSize.w / initSize.h, 0.1, 1600);
    camera.position.set(8.6, 3.6, 9.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(initSize.w, initSize.h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.25, 0.2);
    controls.maxPolarAngle = Math.PI * 0.492;
    controls.minDistance = 2.8;
    controls.maxDistance = 26;

    // Overcast Wet Parade Lighting (Deep Low-Glare Tactical Atmosphere)
    const hemiLight = new THREE.HemisphereLight(0xcbd5e1, 0x111612, 0.72);
    hemiLight.position.set(0, 25, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfef3c7, 1.15);
    dirLight.position.set(12, 18, 14);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 2;
    dirLight.shadow.camera.far = 45;
    const d = 8.5;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    const rimLight = new THREE.DirectionalLight(0x64748b, 0.42);
    rimLight.position.set(-14, 8, -12);
    scene.add(rimLight);

    // =========================================================================
    // 2. HIGH-REALISM PROCEDURAL PBR CANVAS TEXTURES (MATTE CAST ARMOR & RUBBER)
    // =========================================================================
    function createOliveArmorTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      // Rich Russian military dark olive drab (ХС-5146 / 4БО deep matte green)
      ctx.fillStyle = 'rgb(44, 58, 40)';
      ctx.fillRect(0, 0, 512, 512);

      // Organic blotchy weathering & damp rain-streak modulation
      for (let p = 0; p < 220; p++) {
        const px = Math.random() * 512;
        const py = Math.random() * 512;
        const rad = 18 + Math.random() * 55;
        const g = ctx.createRadialGradient(px, py, 2, px, py, rad);
        const dark = Math.random() > 0.45;
        g.addColorStop(0, dark ? 'rgba(26, 35, 24, 0.22)' : 'rgba(58, 74, 52, 0.18)');
        g.addColorStop(1, 'rgba(44, 58, 40, 0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI * 2); ctx.fill();
      }

      // Fine rolled/cast steel surface micro-pitting (24,000 micro-pores)
      for (let i = 0; i < 24000; i++) {
        const v = (Math.random() - 0.5) * 16;
        ctx.fillStyle = `rgb(${Math.max(22, 44 + v)}, ${Math.max(30, 58 + v)}, ${Math.max(20, 40 + v)})`;
        ctx.fillRect(Math.random() * 512, Math.random() * 512, 1.5, 1.5);
      }

      // Subtle vertical rain/damp streaks
      for (let s = 0; s < 90; s++) {
        ctx.fillStyle = 'rgba(24, 32, 22, 0.14)';
        ctx.fillRect(Math.random() * 512, Math.random() * 512, 1.5, 25 + Math.random() * 70);
      }

      // Recessed weld & armor plate seam + hex bolt heads
      ctx.strokeStyle = 'rgba(20, 28, 18, 0.55)';
      ctx.lineWidth = 3;
      ctx.strokeRect(3, 3, 506, 506);
      ctx.strokeStyle = 'rgba(68, 86, 62, 0.25)';
      ctx.lineWidth = 1;
      ctx.strokeRect(6, 6, 500, 500);

      [[16,16],[496,16],[16,496],[496,496],[256,16],[256,496]].forEach(([x,y]) => {
        ctx.fillStyle = 'rgb(26, 35, 24)';
        ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgb(54, 70, 49)';
        ctx.beginPath(); ctx.arc(x - 1, y - 1, 4.2, 0, Math.PI * 2); ctx.fill();
      });

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = 4;
      return tex;
    }

    function createArmorBumpTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = 'rgb(128, 128, 128)';
      ctx.fillRect(0, 0, 512, 512);
      // High-frequency cast steel & anti-radiation coating micro-roughness
      for (let i = 0; i < 32000; i++) {
        const b = 90 + Math.floor(Math.random() * 76);
        ctx.fillStyle = `rgb(${b},${b},${b})`;
        ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
      }
      // Deep panel groove & raised weld bead
      ctx.strokeStyle = 'rgb(35, 35, 35)';
      ctx.lineWidth = 4;
      ctx.strokeRect(3, 3, 506, 506);
      [[16,16],[496,16],[16,496],[496,496],[256,16],[256,496]].forEach(([x,y]) => {
        ctx.fillStyle = 'rgb(225, 225, 225)';
        ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
      });
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createRubberTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = 'rgb(20, 22, 21)';
      ctx.fillRect(0, 0, 256, 256);
      // Heavy vulcanized rubber fabric weave & road dust near bottom
      for (let i = 0; i < 9000; i++) {
        const v = 15 + Math.floor(Math.random() * 14);
        ctx.fillStyle = `rgb(${v}, ${v + 1}, ${v})`;
        ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 1.5);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createParadeNumberTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = 'rgb(28, 36, 27)';
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 3000; i++) {
        const v = (Math.random() - 0.5) * 10;
        ctx.fillStyle = `rgb(${28 + v}, ${36 + v}, ${27 + v})`;
        ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
      }
      // Authentic stenciled off-white tactical box & number "1"
      ctx.fillStyle = '#d8dee3';
      ctx.fillRect(28, 28, 200, 200);
      ctx.fillStyle = 'rgb(26, 34, 25)';
      ctx.fillRect(42, 42, 172, 172);
      ctx.fillStyle = '#d8dee3';
      ctx.font = 'bold 138px "Rajdhani", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('1', 128, 134);
      return new THREE.CanvasTexture(c);
    }

    function createHeadlightLensTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 8, 128, 128, 124);
      grad.addColorStop(0, '#fffbeb');
      grad.addColorStop(0.45, '#fde047');
      grad.addColorStop(0.82, '#d97706');
      grad.addColorStop(1, '#451a03');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);
      // Fresnel vertical fluted glass ribs (ФГ-127 tank headlamp lens)
      ctx.strokeStyle = 'rgba(120, 53, 15, 0.38)';
      ctx.lineWidth = 2;
      for (let x = 16; x < 240; x += 10) {
        ctx.beginPath(); ctx.moveTo(x, 12); ctx.lineTo(x, 244); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(128, 128, 92, 0, Math.PI * 2); ctx.stroke();
      return new THREE.CanvasTexture(c);
    }

    function createTrackPadTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#141615';
      ctx.fillRect(0, 0, 256, 256);
      for (let y = 0; y < 256; y += 32) {
        // Worn forged steel connector pin bar
        ctx.fillStyle = '#252927';
        ctx.fillRect(0, y, 256, 8);
        // Matte black RMSh rubber asphalt pads
        ctx.fillStyle = '#0d0f0e';
        ctx.fillRect(18, y + 10, 96, 18);
        ctx.fillRect(142, y + 10, 96, 18);
        // Center guide tooth channel
        ctx.fillStyle = '#313633';
        ctx.fillRect(122, y + 8, 12, 22);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 14);
      return tex;
    }

    function createWetAsphaltTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#242b28';
      ctx.fillRect(0, 0, 512, 512);
      // Visible proving ground dirt/asphalt tracks, grid seams & gravel contrast
      for (let i = 0; i < 16000; i++) {
        const shade = 26 + Math.floor(Math.random() * 34);
        ctx.fillStyle = `rgb(${shade}, ${shade + 4}, ${shade + 2})`;
        ctx.fillRect(Math.random() * 512, Math.random() * 512, 2.5, 2.5);
      }
      // Concrete slab / range lane markings so ground motion and horizon are always unmistakable
      ctx.strokeStyle = 'rgba(148, 163, 150, 0.22)';
      ctx.lineWidth = 3;
      ctx.strokeRect(4, 4, 504, 504);
      ctx.fillStyle = 'rgba(200, 215, 200, 0.08)';
      ctx.fillRect(140, 0, 65, 512);
      ctx.fillRect(305, 0, 65, 512);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(90, 90);
      return tex;
    }

    function createGunmetalTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      // Blued / parkerized Russian ordnance steel (вороненая оружейная сталь 6П49 КОРД)
      ctx.fillStyle = 'rgb(26, 30, 32)';
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 12000; i++) {
        const v = (Math.random() - 0.5) * 14;
        ctx.fillStyle = `rgb(${Math.max(14, 26 + v)}, ${Math.max(16, 30 + v)}, ${Math.max(18, 32 + v)})`;
        ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 1.5);
      }
      // Subtle machined receiver striations & metallic edge wear
      for (let y = 0; y < 256; y += 16) {
        ctx.fillStyle = 'rgba(75, 85, 92, 0.14)';
        ctx.fillRect(0, y, 256, 1);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    const oliveTex = createOliveArmorTexture();
    const armorBumpTex = createArmorBumpTexture();
    const rubberTex = createRubberTexture();
    const gunmetalTex = createGunmetalTexture();
    const paradeMarkTex = createParadeNumberTexture();
    const headlightLensTex = createHeadlightLensTexture();
    const trackTex = createTrackPadTexture();
    const asphaltTex = createWetAsphaltTexture();

    // Shared Materials Registry (Light-Absorbing Deep Matte Military Finish)
    const materials = {
      kordGunmetal: new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: gunmetalTex,
        bumpMap: armorBumpTex,
        bumpScale: 0.014,
        roughnessMap: armorBumpTex,
        roughness: 0.58,
        metalness: 0.65
      }),
      brassShell: new THREE.MeshStandardMaterial({
        color: 0xd97706,
        roughness: 0.32,
        metalness: 0.85
      }),
      armorOlive: new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: oliveTex,
        bumpMap: armorBumpTex,
        bumpScale: 0.016,
        roughnessMap: armorBumpTex,
        roughness: 0.89,
        metalness: 0.08
      }),
      eraOlive: new THREE.MeshStandardMaterial({
        color: 0xf4f7f2,
        map: oliveTex,
        bumpMap: armorBumpTex,
        bumpScale: 0.014,
        roughnessMap: armorBumpTex,
        roughness: 0.86,
        metalness: 0.10
      }),
      paradeMark: new THREE.MeshStandardMaterial({
        map: paradeMarkTex,
        bumpMap: armorBumpTex,
        bumpScale: 0.01,
        roughness: 0.85,
        metalness: 0.06
      }),
      darkSteel: new THREE.MeshStandardMaterial({
        color: 0xdce3d8,
        map: oliveTex,
        bumpMap: armorBumpTex,
        bumpScale: 0.012,
        roughnessMap: armorBumpTex,
        roughness: 0.84,
        metalness: 0.14
      }),
      gunBarrelMetal: new THREE.MeshStandardMaterial({
        color: 0xe8efe4,
        map: oliveTex,
        bumpMap: armorBumpTex,
        bumpScale: 0.01,
        roughnessMap: armorBumpTex,
        roughness: 0.85,
        metalness: 0.12
      }),
      rubberBlack: new THREE.MeshStandardMaterial({
        color: 0x141615,
        map: rubberTex,
        bumpMap: rubberTex,
        bumpScale: 0.015,
        roughness: 0.96,
        metalness: 0.02
      }),
      trackMat: new THREE.MeshStandardMaterial({
        map: trackTex,
        bumpMap: trackTex,
        bumpScale: 0.025,
        roughness: 0.88,
        metalness: 0.28
      }),
      opticsGlass: new THREE.MeshStandardMaterial({
        color: 0x064e3b,
        emissive: 0x022c22,
        emissiveIntensity: 0.35,
        roughness: 0.15,
        metalness: 0.85
      }),
      headlightWarm: new THREE.MeshStandardMaterial({
        color: 0xfef08a,
        map: headlightLensTex,
        emissive: 0xf59e0b,
        emissiveMap: headlightLensTex,
        emissiveIntensity: 2.2,
        roughness: 0.22,
        metalness: 0.1
      }),
      turbineHot: new THREE.MeshStandardMaterial({
        color: 0x1c1917,
        emissive: 0xea580c,
        emissiveIntensity: 0.25,
        roughness: 0.75,
        metalness: 0.35
      }),
      whiteTrim: new THREE.MeshStandardMaterial({
        color: 0xd8dee3,
        roughness: 0.82,
        metalness: 0.04
      })
    };

    // Wet 1 km x 1 km Proving Ground Plane (Учебный танковый полигон 1000м x 1000м)
    const RANGE_SIZE = 1000;
    const RANGE_HALF = RANGE_SIZE / 2; // -500m to +500m
    asphaltTex.repeat.set(90, 90);
    const groundGeo = new THREE.PlaneGeometry(RANGE_SIZE, RANGE_SIZE);
    const groundMat = new THREE.MeshStandardMaterial({
      map: asphaltTex,
      roughness: 0.56,
      metalness: 0.14
    });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.receiveShadow = true;
    scene.add(groundMesh);

    const gridHelper = new THREE.GridHelper(RANGE_SIZE, 100, 0x648268, 0x3b4d3e);
    gridHelper.position.y = 0.015;
    gridHelper.material.opacity = 0.48;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // =========================================================================
    // 2B. PROCEDURAL PROVING GROUND TARGET RANGE (МИШЕННОЕ ПОЛЕ ПОЛИГОНА)
    // =========================================================================
    const rangeEnvironmentGroup = new THREE.Group();
    scene.add(rangeEnvironmentGroup);

    const rangeTargets = [];
    let targetsDestroyedCount = 0;

    function createRangeTargetTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      // High-visibility olive/dark-green armored target silhouette with white aiming border & bullseye
      ctx.fillStyle = '#1e281d';
      ctx.fillRect(0, 0, 256, 256);
      // Outer white range visibility border
      ctx.strokeStyle = '#f1f5f9';
      ctx.lineWidth = 10;
      ctx.strokeRect(12, 12, 232, 232);
      // Tank silhouette shape
      ctx.fillStyle = '#2d3b2b';
      ctx.fillRect(28, 120, 200, 108);
      ctx.beginPath();
      ctx.arc(128, 120, 64, Math.PI, 0, false);
      ctx.fill();
      // Tactical orange/white aiming cross & rings in center
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(128, 134, 46, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(128, 134, 20, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(64, 134); ctx.lineTo(192, 134);
      ctx.moveTo(128, 70); ctx.lineTo(128, 198);
      ctx.stroke();
      return c;
    }

    function buildSingleRangeTarget(x, z) {
      const targetRoot = new THREE.Group();
      targetRoot.position.set(x, 0, z);

      // Flat steel ground baseplate (sits flush on ground y=0.02 so tank tracks never clip into a raised mound)
      const basePlate = new THREE.Mesh(
        new THREE.BoxGeometry(2.6, 0.04, 0.9),
        materials.darkSteel
      );
      basePlate.position.set(0, 0.02, 0.0);
      targetRoot.add(basePlate);

      // Hinged pivot group at ground level (y=0.05) so the target falls flat onto the ground (-90 deg) when hit or rammed
      const hingeGroup = new THREE.Group();
      hingeGroup.position.set(0, 0.05, 0);
      targetRoot.add(hingeGroup);

      // Steel support legs
      [-0.85, 0.85].forEach(lx => {
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.10, 2.3, 0.10), materials.darkSteel);
        post.position.set(lx, 1.15, -0.08);
        hingeGroup.add(post);
      });

      // Individual mutable CanvasTexture per target so 12.7mm Kord hits punch real bullet holes into it!
      const baseCanvas = createRangeTargetTexture();
      const targetCanvas = document.createElement('canvas');
      targetCanvas.width = 256; targetCanvas.height = 256;
      const targetCtx = targetCanvas.getContext('2d');
      targetCtx.drawImage(baseCanvas, 0, 0);
      const targetTex = new THREE.CanvasTexture(targetCanvas);

      const boardMat = new THREE.MeshStandardMaterial({
        map: targetTex,
        emissive: 0xfffbeb,
        emissiveMap: targetTex,
        emissiveIntensity: 0.48,
        roughness: 0.55,
        metalness: 0.12
      });

      const boardMesh = new THREE.Mesh(new THREE.BoxGeometry(3.4, 2.8, 0.14), boardMat);
      boardMesh.position.set(0, 1.55, 0);
      boardMesh.castShadow = true;
      boardMesh.receiveShadow = true;
      hingeGroup.add(boardMesh);

      // High-intensity thermal beacon strip on top for unmistakable visibility in FLIR / Sosna-U mode
      const beacon = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.22, 0.22), materials.turbineHot);
      beacon.position.set(0, 3.08, 0);
      hingeGroup.add(beacon);

      rangeEnvironmentGroup.add(targetRoot);

      const targetObj = {
        root: targetRoot,
        hinge: hingeGroup,
        boardMesh,
        canvas: targetCanvas,
        ctx: targetCtx,
        tex: targetTex,
        baseCanvas,
        fallen: false,
        bulletHoles: 0
      };
      boardMesh.userData.targetObj = targetObj;
      rangeTargets.push(targetObj);
    }

    // Populate 1km x 1km Proving Ground with 28 targets & build Perimeter Fence with Barbed Wire
    function createChainlinkFenceTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 256, 256);
      // Diamond chain-link wire mesh
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.65)';
      ctx.lineWidth = 2;
      const step = 24;
      for (let i = -256; i < 512; i += step) {
        ctx.beginPath(); ctx.moveTo(i, 48); ctx.lineTo(i + 256, 256); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(i + 256, 48); ctx.lineTo(i, 256); ctx.stroke();
      }
      // Horizontal tension cables
      ctx.strokeStyle = 'rgba(203, 213, 225, 0.85)';
      ctx.lineWidth = 3;
      [52, 145, 250].forEach(y => {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
      });
      // Top 3 strands of Barbed Wire + Razor Concertina Coils + X-Barbs
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2.2;
      [10, 24, 38].forEach(y => {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
        for (let bx = 12; bx < 256; bx += 22) {
          ctx.beginPath();
          ctx.moveTo(bx - 4, y - 5); ctx.lineTo(bx + 4, y + 5);
          ctx.moveTo(bx + 4, y - 5); ctx.lineTo(bx - 4, y + 5);
          ctx.stroke();
        }
      });
      // Spiral concertina wire loops along top edge
      ctx.strokeStyle = 'rgba(226, 232, 240, 0.78)';
      ctx.lineWidth = 1.8;
      for (let cx = 0; cx <= 256; cx += 18) {

    // Puncture bullet hole on target canvas & spawn sparks when hit by 12.7mm Kord
    function registerKordBulletHit(targetObj, hitPointWorld) {
      if (targetObj.fallen) return;
      targetObj.bulletHoles++;

      // Convert world hit point to board local coordinates (-1.7..+1.7 X, -1.4..+1.4 Y)
      const localPt = targetObj.boardMesh.worldToLocal(hitPointWorld.clone());
      const u = THREE.MathUtils.clamp((localPt.x / 3.4) + 0.5, 0.05, 0.95);
      const v = THREE.MathUtils.clamp(0.5 - (localPt.y / 2.8), 0.05, 0.95);
      const cx = u * 256;
      const cy = v * 256;

      const ctx = targetObj.ctx;
      // Scorched crater rim
      const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, 14);
      g.addColorStop(0, '#050505');
      g.addColorStop(0.45, '#1c1917');
      g.addColorStop(0.75, '#78716c');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2); ctx.fill();
      // Jagged bright metal spall marks & black hole center
      ctx.fillStyle = '#d6d3d1';
      for (let s = 0; s < 5; s++) {
        const a = Math.random() * Math.PI * 2;
        ctx.fillRect(cx + Math.cos(a) * 6, cy + Math.sin(a) * 6, 3, 3);
      }
      ctx.fillStyle = '#000000';
      ctx.beginPath(); ctx.arc(cx, cy, 5.5, 0, Math.PI * 2); ctx.fill();
      targetObj.tex.needsUpdate = true;

      // Also place a 3D dark puncture decal disc on the board face so it's visible even from steep angles
      const holeDisc = new THREE.Mesh(
        new THREE.CircleGeometry(0.085, 10),
        new THREE.MeshBasicMaterial({ color: 0x050505, side: THREE.DoubleSide })
      );
      holeDisc.position.set(localPt.x, localPt.y, 0.076);
      targetObj.boardMesh.add(holeDisc);

      // Impact metallic shudder
      gsap.fromTo(targetObj.hinge.rotation, { x: -0.06 }, { x: 0, duration: 0.18, ease: 'elastic.out(1.2, 0.3)' });

      // Impact sparks & dust puff at hit point
      for (let i = 0; i < 5; i++) {
        spawnParticleSprite(
          fireballTex, 0xfef08a, THREE.AdditiveBlending,
          hitPointWorld.clone(),
          new THREE.Vector3((Math.random() - 0.5) * 6, 1.5 + Math.random() * 4, -2 - Math.random() * 4),
          0.22, 0.05, 0.18, 0.9, -6, 1.0
        );
      }
      spawnParticleSprite(
        smokeCloudTex, 0xa8a29e, THREE.NormalBlending,
        hitPointWorld.clone(),
        new THREE.Vector3((Math.random() - 0.5) * 2, 0.8 + Math.random() * 1.5, -1),
        0.35, 1.2, 0.65, 0.92, 0.4, 0.65
      );
    }

    // Knock down target when hit by 125mm APFSDS shell
    function knockDownRangeTarget(targetObj, hitPointWorld) {
      if (targetObj.fallen) return;
      targetObj.fallen = true;
      targetsDestroyedCount++;

      // Violent fiery explosion & smoke plume on the target
      for (let i = 0; i < 14; i++) {
        spawnParticleSprite(
          fireballTex, i < 5 ? 0xffffff : 0xf97316, THREE.AdditiveBlending,
          hitPointWorld.clone(),
          new THREE.Vector3((Math.random() - 0.5) * 12, 2 + Math.random() * 9, (Math.random() - 0.5) * 12),
          1.2, 3.6, 0.32 + Math.random() * 0.2, 0.88, 1.0, 1.0
        );
      }
      for (let s = 0; s < 18; s++) {
        spawnParticleSprite(
          smokeCloudTex, 0x57534e, THREE.NormalBlending,
          hitPointWorld.clone(),
          new THREE.Vector3((Math.random() - 0.5) * 8, 1.5 + Math.random() * 6, (Math.random() - 0.5) * 8),
          1.4, 4.8, 1.6 + Math.random() * 1.2, 0.92, 1.1, 0.85
        );
      }

      // Slam target board flat backward onto the ground (-90 deg)
      gsap.to(targetObj.hinge.rotation, {
        x: -Math.PI / 2,
        duration: 0.42,
        ease: 'bounce.out'
      });

      // Auto pop-up target again after 9 seconds so the proving ground stays active
      setTimeout(() => {
        if (!targetObj.fallen) return;
        gsap.to(targetObj.hinge.rotation, {
          x: 0,
          duration: 0.65,
          ease: 'back.out(1.4)',
          onComplete: () => { targetObj.fallen = false; }
        });
      }, 9000);
    }

      // Build Sawtooth (Zig-Zag) Rubber Flap Geometry via ExtrudeGeometry
      function createSawtoothRubberSkirt(lengthZ) {
        const teethCount = 14;
        const step = lengthZ / teethCount;
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.lineTo(lengthZ, 0);
        // Zig-zag sawtooth cutouts along bottom edge (authentic parade T-80BVM trim)
        for (let i = teethCount; i >= 1; i--) {
          const xEnd = (i - 1) * step;
          const xMid = xEnd + step * 0.5;
          shape.lineTo(xMid, -0.22);
          shape.lineTo(xEnd, -0.07);
        }
        shape.closePath();

        const geom = new THREE.ExtrudeGeometry(shape, { depth: 0.025, bevelEnabled: false });
        const mesh = new THREE.Mesh(geom, materials.rubberBlack);
        mesh.rotation.y = Math.PI / 2;
        return mesh;
      }

    // Procedural Soft Volumetric Fire & Turbulent Smoke Sprite Textures
    function createFireballSpriteTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(128, 128, 6, 128, 128, 122);
      g.addColorStop(0.0, 'rgba(255, 255, 245, 1.0)');
      g.addColorStop(0.22, 'rgba(254, 240, 138, 0.96)');
      g.addColorStop(0.48, 'rgba(249, 115, 22, 0.82)');
      g.addColorStop(0.75, 'rgba(180, 40, 10, 0.35)');
      g.addColorStop(1.0, 'rgba(60, 10, 0, 0.0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 256);
      // Organic turbulent flame lobes
      for (let i = 0; i < 28; i++) {
        const ang = (i / 28) * Math.PI * 2;
        const r = 35 + Math.random() * 48;
